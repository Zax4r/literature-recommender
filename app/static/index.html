<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Литература</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#faf8f5; --card:#fff; --text:#222; --muted:#777; --accent:#8a3b12; --line:#e6e0d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#181614; --card:#221f1c; --text:#eee; --muted:#9a948c; --accent:#e0905a; --line:#38332d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0 auto 0 0; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  input { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); width:100%; }
  .tabs button.active { border-color:var(--accent); color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; position:relative; }
    .card .meta { padding:12px 40px 12px 12px; }
  .card .title { font-weight:600; font-size:14px; }
  .muted { color:var(--muted); font-size:13px; }
  .heart { position:absolute; top:6px; right:6px; background:var(--card); border-radius:50%; width:32px; height:32px; padding:0; }
  .heart.on { color:#d33; }
  .pager { display:flex; gap:12px; align-items:center; justify-content:center; margin:20px 0; }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); max-width:520px; width:92%; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  .form { display:grid; gap:10px; max-width:340px; margin:40px auto; }
  .error { color:#d33; min-height:1.4em; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; clear:both; }
  .tag { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:14px; padding:2px 4px 2px 10px; font-size:13px; }
  .tag button { padding:0 5px; border:none; background:none; font-size:12px; color:var(--muted); }
  .tag button.on { color:var(--accent); font-weight:700; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .badge { font-size:12px; color:var(--accent); }
  select { font:inherit; padding:5px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); }
  textarea { font:inherit; width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); }
  .rec { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:14px; background:var(--card); }
  .rec .grid { margin-top:10px; }
  .chat-box { display:flex; flex-direction:column; gap:8px; }
  .bubble { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; white-space:pre-wrap; }
  .bubble.me { border-color:var(--accent); }
  .stores { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .stores a { font-size:12px; border:1px solid var(--line); border-radius:12px; padding:1px 8px; text-decoration:none; }
  button.rec-on { background:#d33; border-color:#d33; color:#fff; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>📚 Литература</h1>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="feed" class="active">Лента</button>
    <button data-tab="favorites">Избранное</button>
    <button data-tab="library">Библиотека</button>
    <button data-tab="recs">Чат</button>
  </nav>
  <span id="who" class="muted"></span>
  <button id="authBtn">Войти</button>
</header>

<main>
  <section id="authForm" class="form" hidden>
    <input id="login" placeholder="Логин или email" autocomplete="username">
    <input id="email" type="email" placeholder="Email (для регистрации)" autocomplete="email">
    <input id="password" type="password" placeholder="Пароль (от 8 символов для регистрации)" autocomplete="current-password">
    <div class="error" id="authError"></div>
    <button class="primary" id="loginBtn">Войти</button>
    <button id="registerBtn">Зарегистрироваться (логин = username)</button>
  </section>

  <section id="recsPanel" hidden>
    <textarea id="recQuery" rows="3" placeholder="Опишите, что хотите почитать, или назовите книгу, на которую хотите быть похожей"></textarea>
    <div class="row">
      <button class="primary" id="recBtn">Отправить</button>
      <button id="micBtn" title="Записать голос">🎤 Голос</button>
      <label class="muted">файл (.txt, .pdf, .docx, аудио) <input type="file" id="recFile" style="width:auto;border:none"></label>
    </div>
    <div class="muted" id="recStatus"></div>
    <div class="error" id="recError"></div>
    <div class="chat-box" id="recList"></div>
  </section>

  <section id="list">
    <div class="row" id="libFilter" hidden>
      <span class="muted">Статус:</span>
      <select id="libStatus"></select>
    </div>
    <div class="muted" id="status"></div>
    <div class="grid" id="grid"></div>
    <div class="pager">
      <button id="prev">← Назад</button>
      <span id="pageInfo" class="muted"></span>
      <button id="next">Вперёд →</button>
    </div>
  </section>
</main>

<dialog id="dialog"></dialog>

<script>
const API = "/api/v1";
const LIMIT = 12;
const $ = (id) => document.getElementById(id);
const STATUSES = { read: "Прочитано", reading: "Читаю", dropped: "Брошено", planned: "В планах" };
const state = { libStatus: "", recorder: null, token: localStorage.getItem("token"), me: null, tab: "feed", offset: 0, total: 0 };

async function api(path, { method = "GET", body, form } = {}) {
  const headers = {};
  if (state.token) headers.Authorization = `Bearer ${state.token}`;
  let payload;
  if (form) payload = new URLSearchParams(form);
  else if (body) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
  const res = await fetch(API + path, { method, headers, body: payload });
  if (res.status === 401 && state.token) { logout(); }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const detail = Array.isArray(err.detail) ? err.detail.map((d) => d.msg).join("; ") : err.detail;
    throw new Error(detail || res.statusText);
  }
  return res.status === 204 ? null : res.json();
}

function logout() {
  state.token = null; state.me = null; state.tab = "feed"; state.offset = 0;
  localStorage.removeItem("token");
  render();
}

async function loadMe() {
  state.me = state.token ? await api("/users/me").catch(() => null) : null;
}

async function render() {
  const authed = !!state.me;
  $("tabs").hidden = !authed;
  $("who").textContent = authed ? state.me.username : "";
  $("authBtn").textContent = authed ? "Выйти" : "Войти";
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
  $("authForm").hidden = true;
  const isRecs = state.tab === "recs";
  $("recsPanel").hidden = !isRecs;
  $("list").hidden = isRecs;
  $("libFilter").hidden = state.tab !== "library";
  if (isRecs) await loadRecs(); else await loadBooks();
}

async function loadBooks() {
  const paths = { feed: "/books", favorites: "/users/me/favorites", library: "/users/me/library" };
  const extra = state.tab === "library" && state.libStatus ? `&status=${state.libStatus}` : "";
  try {
    const page = await api(`${paths[state.tab]}?offset=${state.offset}&limit=${LIMIT}${extra}`);
    state.total = page.total;
    $("status").textContent = page.total ? "" : ({ favorites: "В избранном пока пусто.", library: "На полках пока пусто.", feed: "Каталог пуст: запустите загрузку (docker compose up)." })[state.tab];
    $("grid").replaceChildren(...page.items.map(card));
    const from = page.total ? state.offset + 1 : 0;
    $("pageInfo").textContent = `${from}–${state.offset + page.items.length} из ${page.total}`;
    $("prev").disabled = state.offset === 0;
    $("next").disabled = state.offset + LIMIT >= page.total;
  } catch (e) { $("status").textContent = e.message; }
}

function el(tag, props = {}, ...kids) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...kids);
  return node;
}

function heart(book, onChange) {
  if (!state.me) return null;
  const btn = el("button", { className: "heart" + (book.is_favorite ? " on" : ""), title: "В избранное" }, book.is_favorite ? "♥" : "♡");
  btn.onclick = async (ev) => {
    ev.stopPropagation();
    await api(`/books/${book.id}/favorite`, { method: book.is_favorite ? "DELETE" : "PUT" });
    book.is_favorite = !book.is_favorite;
    onChange();
  };
  return btn;
}

function card(book) {
  const node = el("div", { className: "card", onclick: () => openBook(book.id) });
  const rebuild = () => { if (state.tab === "favorites") loadBooks(); else node.replaceWith(card(book)); };
  const badge = book.status ? el("div", { className: "badge" }, STATUSES[book.status] + (book.rating ? ` · ${"★".repeat(book.rating)}` : "")) : "";
  node.append(
    el("div", { className: "meta" }, el("div", { className: "title" }, book.title), el("div", { className: "muted" }, book.author), badge),
  );
  const h = heart(book, rebuild);
  if (h) node.append(h);
  return node;
}

async function openBook(id) {
  const book = await api(`/books/${id}`);
  const dlg = $("dialog");
  const refresh = () => { loadBooks(); openBook(id); };

  const tagBox = el("div", { className: "tags" });
  const drawTags = (tags) => {
    tagBox.replaceChildren(...tags.map((t) => {
      const vote = async (value) => {
        const next = await api(`/books/${id}/tags/${t.id}/vote`, t.my_vote === value ? { method: "DELETE" } : { method: "PUT", body: { value } });
        drawTags(next);
      };
      const chip = el("span", { className: "tag" }, `${t.name} ${t.score}`);
      if (state.me) chip.append(
        el("button", { className: t.my_vote === 1 ? "on" : "", onclick: () => vote(1), title: "За" }, "▲"),
        el("button", { className: t.my_vote === -1 ? "on" : "", onclick: () => vote(-1), title: "Против" }, "▼"),
      );
      return chip;
    }));
  };
  drawTags(book.tags);

  const body = el("div", {},
    el("h2", {}, book.title),
    el("div", { className: "muted" }, book.author),
    el("div", { className: "muted" }, book.genres.join(" · ")),
    el("p", {}, book.description.length >= 250 ? book.description + "…" : book.description),
    tagBox,
  );
  const actions = el("div", { style: "clear:both" });

  if (state.me) {
    const addTag = el("input", { placeholder: "Предложить тег", style: "width:180px" });
    const addBtn = el("button", {}, "+");
    addBtn.onclick = async () => {
      if (!addTag.value.trim()) return;
      try { drawTags(await api(`/books/${id}/tags`, { method: "POST", body: { name: addTag.value } })); addTag.value = ""; }
      catch (e) { addTag.value = ""; addTag.placeholder = e.message; }
    };
    const status = el("select", {}, el("option", { value: "" }, "— на полку —"),
      ...Object.entries(STATUSES).map(([v, l]) => el("option", { value: v, selected: book.status === v }, l)));
    const rating = el("select", {}, el("option", { value: "" }, "оценка"),
      ...[1, 2, 3, 4, 5].map((n) => el("option", { value: n, selected: book.rating === n }, "★".repeat(n))));
    const save = async () => {
      if (!status.value) await api(`/books/${id}/entry`, { method: "DELETE" });
      else await api(`/books/${id}/entry`, { method: "PUT", body: { status: status.value, rating: rating.value ? +rating.value : null } });
      loadBooks();
    };
    status.onchange = save; rating.onchange = save;
    const fav = el("button", {}, book.is_favorite ? "♥ Убрать из избранного" : "♡ В избранное");
    fav.onclick = async () => { await api(`/books/${id}/favorite`, { method: book.is_favorite ? "DELETE" : "PUT" }); refresh(); };
    actions.append(el("div", { className: "row" }, addTag, addBtn), el("div", { className: "row" }, status, rating, fav));
  }
  actions.append(el("div", { className: "row" },
    el("a", { href: book.store_url, target: "_blank", rel: "noopener" }, "Найти в магазине"),
    el("button", { onclick: () => dlg.close(), style: "margin-left:auto" }, "Закрыть")));
  dlg.replaceChildren(body, actions);
  if (!dlg.open) dlg.showModal();
}

function storeLinks(stores) {
  return el("div", { className: "stores" }, ...stores.map((x) => el("a", { href: x.url, target: "_blank", rel: "noopener" }, x.name)));
}

function recBlock(rec) {
  const grid = el("div", { className: "grid" }, ...rec.items.map((i) => {
    const node = card(i.book);
    node.querySelector(".meta").append(el("div", { className: "muted" }, i.reason), storeLinks(i.stores));
    node.onclick = (ev) => { if (!ev.target.closest("a")) openBook(i.book.id); };
    return node;
  }));
  return el("div", {},
    el("div", { className: "bubble me" }, rec.query),
    el("div", { className: "bubble" }, rec.answer),
    rec.items.length ? grid : "");
}

async function loadRecs() {
  const page = await api("/recommendations?limit=10");
  $("recList").replaceChildren(...page.items.map(recBlock));
}

async function sendChat(message, file) {
  $("recError").textContent = "";
  $("recStatus").textContent = "Думаю…";
  $("recBtn").disabled = true;
  try {
    const data = new FormData();
    if (message) data.append("message", message);
    if (file) data.append("file", file);
    const res = await fetch("/api/v1/chat", { method: "POST", headers: { Authorization: `Bearer ${state.token}` }, body: data });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    const result = await res.json();
    $("recQuery").value = ""; $("recFile").value = "";
    if (result.recommendation_id) await loadRecs();
    else $("recList").prepend(el("div", {}, el("div", { className: "bubble me" }, message || "(файл)"), el("div", { className: "bubble" }, result.answer)));
  } catch (e) { $("recError").textContent = e.message; }
  $("recStatus").textContent = "";
  $("recBtn").disabled = false;
}

async function submitAuth(register) {
  $("authError").textContent = "";
  try {
    const login = $("login").value.trim(), password = $("password").value;
    if (register) {
      await api("/auth/register", { method: "POST", body: { email: $("email").value.trim(), username: login, password } });
    }
    const t = await api("/auth/login", { method: "POST", form: { username: login, password } });
    state.token = t.access_token;
    localStorage.setItem("token", state.token);
    await loadMe();
    state.offset = 0;
    render();
  } catch (e) { $("authError").textContent = e.message; }
}

$("authBtn").onclick = () => {
  if (state.me) return logout();
  $("authForm").hidden = false; $("list").hidden = true;
};
$("loginBtn").onclick = () => submitAuth(false);
$("registerBtn").onclick = () => submitAuth(true);
$("recBtn").onclick = () => {
  const message = $("recQuery").value.trim(), file = $("recFile").files[0];
  if (message || file) sendChat(message, file);
};
$("recFile").onchange = () => { if (!$("recQuery").value.trim()) sendChat("", $("recFile").files[0]); };
$("micBtn").onclick = async () => {
  if (state.recorder) { state.recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    state.recorder = new MediaRecorder(stream);
    state.recorder.ondataavailable = (e) => chunks.push(e.data);
    state.recorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      state.recorder = null;
      $("micBtn").classList.remove("rec-on"); $("micBtn").textContent = "🎤 Голос";
      sendChat("", new File(chunks, "voice.webm", { type: "audio/webm" }));
    };
    state.recorder.start();
    $("micBtn").classList.add("rec-on"); $("micBtn").textContent = "■ Стоп";
  } catch (e) { $("recError").textContent = "Нет доступа к микрофону: " + e.message; }
};
$("libStatus").replaceChildren(el("option", { value: "" }, "все"), ...Object.entries(STATUSES).map(([v, l]) => el("option", { value: v }, l)));
$("libStatus").onchange = () => { state.libStatus = $("libStatus").value; state.offset = 0; loadBooks(); };
$("prev").onclick = () => { state.offset = Math.max(0, state.offset - LIMIT); loadBooks(); };
$("next").onclick = () => { state.offset += LIMIT; loadBooks(); };
document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; state.offset = 0; render(); });
loadMe().then(render);
</script>
</body>
</html>
