[project]
name = "literature-recommender"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    # AI chat and data pipeline
    "faster-whisper>=1.1",
    "av>=15,<17",  # faster-whisper 1.2 breaks on av 17+ (metadata_errors argument)
    "openai>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "qdrant-client>=1.16",
    "sentence-transformers>=2.7",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

# CPU-only torch on Linux: the default CUDA wheels add several GB for nothing.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
# The AI chat and pipeline code (scripts, prompts, app/services/{ai,files,search}) is not linted yet.
extend-exclude = [
    "alembic/versions",
    "scripts",
    "prompts",
    "app/services/ai",
    "app/services/files",
    "app/services/search",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends"]

[tool.mypy]
strict = true
plugins = []
exclude = ["alembic/", "scripts/", "prompts/"]

# Teammate's AI chat code is not type-checked yet.
[[tool.mypy.overrides]]
module = ["app.api.chat", "app.services.ai.*", "app.services.files.*", "app.services.search.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
